[package]
name = "lnl"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
color-eyre = "0.6.5"
dashmap = "6.2.1"
dotenvy = "0.15.7"
ferogram = "0.6.4"
futures-util = "0.3.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.7.0", features = ["cors", "fs"] }

[patch.crates-io]
ferogram-connect = { path = "vendor/ferogram-connect" }
ferogram-mtsender = { path = "vendor/ferogram-mtsender" }
