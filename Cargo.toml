[package]
name = "lnl"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
color-eyre = "0.6.5"
dashmap = "6.2.1"
dotenvy = "0.15.7"
ferogram = "0.6.4"
futures-util = "0.3.33"
getrandom = "0.3.4"
libc = "0.2.189"
mp4 = "0.14.0"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "sync", "net", "time", "fs", "io-util"] }
tokio-util = "0.7.19"
tower-http = { version = "0.7.0", features = ["cors", "fs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[patch.crates-io]
ferogram-connect = { path = "vendor/ferogram-connect" }
ferogram-mtsender = { path = "vendor/ferogram-mtsender" }
